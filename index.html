<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data: blob:; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>國中數學群島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* 單一視覺世界：海島地圖＋紙感面板。左地圖、右學習面板；手機改上下排列 */
  --sea:#47aac8; --sea-deep:#2c7f9e; --shallow:#a9dfe9; --land:#a4d47c;
  --sand:#f3e2b8; --sand-dark:#d9bf86; --grass:#9fd36f; --grass-dark:#6fb04a;
  --paper:#fff8ef; --card:#ffffff; --ink:#1e2b33; --muted:#5d6a71; --line:#eadfcf;
  --ch1:#3a67d1; --ch2:#e9822a; --game:#8a5bd6; --exam:#d6455b; --gold:#e8b21c;
  --good:#2f9e5b; --good-bg:#e6f5ea; --bad:#cf3f45; --bad-bg:#fbe9ea;
  --display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--ch1);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.1;font-size:.9em;margin:0 .1em}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .2em}
.fr>span:last-child{padding:0 .2em}
sup{font-size:.7em;line-height:0}
.hidden{display:none!important}
.sys{display:inline-block;vertical-align:middle;border-left:3px solid currentColor;padding:2px 0 2px 10px;line-height:1.7;margin:4px 0}
.tbl{border-collapse:collapse;margin:10px 0 0;font-size:15px;font-weight:500}
.tbl th,.tbl td{border:1px solid var(--line);padding:4px 12px;text-align:center;background:#fff;font-variant-numeric:tabular-nums}
.tbl th{background:#f6efe5}

/* ---------- 入口頁 ---------- */
#home{height:100%;overflow:auto;background:linear-gradient(#bfe7f1 0,#bfe7f1 120px,var(--sea) 120px,var(--sea-deep) 900px,var(--paper) 900px)}
.home-in{max-width:980px;margin:0 auto;padding:28px 20px 60px}
.home-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.home-top h1{font-size:clamp(34px,6vw,52px);color:#16404f;line-height:1.15}
.home-top p{margin:6px 0 0;color:#234c5b}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:6px 14px;font-weight:700;box-shadow:0 2px 0 rgba(0,0,0,.08);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip .s{color:var(--gold)}
.isles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px;margin-top:40px}
.isle-card{background:none;border:0;padding:0;text-align:center;display:flex;flex-direction:column;align-items:center}
.isle-card svg{width:200px;height:130px;display:block;margin-bottom:-18px;transition:transform .25s}
.isle-card:not([disabled]):hover svg{transform:translateY(-6px)}
.isle-card .box{background:#fff;border-radius:16px;padding:16px 14px 14px;width:100%;border-top:5px solid var(--c);box-shadow:0 6px 0 rgba(0,0,0,.1)}
.isle-card h3{font-size:21px;line-height:1.3}
.isle-card small{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.isle-card .meta{margin-top:8px;font-weight:700;font-variant-numeric:tabular-nums}
.isle-card[disabled]{cursor:default}
.isle-card[disabled] .box{opacity:.78}
.lock{display:inline-block;margin-top:8px;font-size:13px;background:#eef1f3;color:var(--muted);border-radius:999px;padding:2px 10px}
.chapters{background:var(--paper);margin-top:56px;border-radius:20px;padding:26px 22px}
.chapters h2{font-size:26px}
.chapters>p{margin:4px 0 14px;color:var(--muted)}
.vol{font-weight:900;margin:18px 0 8px;color:var(--ch1)}
.crow{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.crow b{font-family:var(--display);font-size:22px;font-weight:400;color:var(--c)}
.crow small{display:block;color:var(--muted);font-size:13px}
.crow .st{font-weight:700;font-variant-numeric:tabular-nums}
.crow[disabled]{opacity:.55;cursor:default}

/* ---------- 島嶼畫面 ---------- */
#island{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,430px)}
.map{position:relative;overflow:hidden;background:var(--land);min-height:0}
.map svg{width:100%;height:100%;display:block}
.hud{position:absolute;z-index:5;left:14px;top:14px;right:14px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.hud>*{pointer-events:auto}
.hud-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.92);border:0;border-radius:12px;padding:7px 12px;font-weight:700;box-shadow:0 2px 0 rgba(0,0,0,.08);font-size:15px;font-variant-numeric:tabular-nums}
.pill.title{font-family:var(--display);font-weight:400;font-size:17px}
.say{position:absolute;z-index:5;left:50%;bottom:14px;transform:translateX(-50%);max-width:calc(100% - 28px);background:#fff;border-radius:14px;padding:8px 14px;box-shadow:0 3px 0 rgba(0,0,0,.1);font-size:14px;display:flex;gap:8px;align-items:center}
.say b{color:var(--grass-dark);white-space:nowrap}
.map canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block;touch-action:none;cursor:grab}
#labels{position:absolute;z-index:1;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;border:0;background:rgba(255,255,255,.95);border-radius:999px;padding:3px 10px 3px 3px;display:flex;gap:6px;align-items:center;font-weight:700;font-size:13px;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.12);line-height:1.4}
.lbl .id{background:var(--c);color:#fff;border-radius:999px;padding:1px 9px}
.lbl .s{color:#888}.lbl .s.on{color:#b8860b}
.lbl.plain{padding:3px 11px;color:var(--c)}
.pill[aria-pressed="true"]{background:var(--ink);color:#fff}
.isle{cursor:pointer}
.isle:hover .top{filter:brightness(1.06)}
.isle:focus{outline:none}
.isle:focus-visible .top{stroke:var(--ink);stroke-width:3}
#teacher{transition:transform 1.3s cubic-bezier(.5,0,.3,1)}
@media (prefers-reduced-motion:reduce){#teacher{transition:none}.isle-card svg{transition:none}}

.panel{background:var(--paper);overflow:auto;border-left:1px solid var(--line);min-height:0}
.ph{position:sticky;top:0;z-index:2;background:var(--paper);border-bottom:1px solid var(--line);padding:16px 20px 14px;display:flex;gap:12px;align-items:center}
.ph .t{flex:1;min-width:0}
.ph .eb{font-size:12px;font-weight:900;color:var(--exam);letter-spacing:.04em}
.ph h2{font-size:26px;line-height:1.2}
.circ{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;flex:none;font-size:18px}
.pb{padding:16px 20px 40px;display:flex;flex-direction:column;gap:14px}
.lead{color:var(--muted);margin:0}
.prog{border:1px solid #f1c9b4;background:#fff3ea;border-radius:16px;padding:14px}
.prog .h{font-size:12px;font-weight:900;color:var(--exam);letter-spacing:.04em;margin-bottom:10px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{background:#fff;border-radius:12px;padding:10px 12px}
.pcard .k{font-weight:700;font-size:14px;display:flex;gap:6px;align-items:center}
.pcard .v{font-family:var(--display);font-size:28px;line-height:1.2;font-variant-numeric:tabular-nums}
.pcard .v small{font-family:var(--body);font-size:13px;color:var(--muted)}
.bar{height:6px;background:#f1e7dc;border-radius:3px;overflow:hidden;margin:4px 0 6px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:3px}
.pcard p{margin:0;font-size:12px;color:var(--muted);line-height:1.45}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px;font-weight:700}
.tab[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chh{font-size:14px;font-weight:900;color:var(--c);margin-top:6px}
.row{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 4px;text-align:left;width:100%}
.row:hover{background:#fff}
.row .no{font-family:var(--display);font-size:26px;color:var(--c)}
.row .nm{font-weight:700;font-size:17px}
.row small{display:block;color:var(--muted);font-size:13px;font-weight:400}
.row .r{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;color:var(--c)}
.flag{color:var(--gold)}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
.stars{display:flex;align-items:center;gap:10px;font-weight:700}
.stars span{font-size:26px;color:#ddd;letter-spacing:2px}
.stars span i{font-style:normal;color:var(--gold)}
.sub h3{font-family:var(--body);font-weight:700;font-size:18px;display:flex;gap:10px;align-items:center}
.sub h3 .n{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:14px;flex:none}
.sub h3 .st{margin-left:auto;font-size:22px;color:#ddd}
.sub h3 .st.on{color:var(--gold)}
.sub ul{margin:10px 0 14px;padding-left:20px}
.sub li{margin-bottom:6px}
.btn{display:block;width:100%;border:0;border-radius:999px;background:var(--ink);color:#fff;padding:12px;font-weight:700;font-size:16px}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.game{background:var(--game)}
.btn.exam{background:var(--exam)}
.gamebox{border-color:#d9c8f3;background:#f7f1ff}
.gamebox h3{color:var(--game)}
.qtop{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;flex-wrap:wrap}
.dots{display:flex;gap:4px;flex:1}
.dots i{width:8px;height:8px;border-radius:50%;background:#e2d8cc}
.dots i.ok{background:var(--good)}.dots i.no{background:var(--bad)}.dots i.cur{background:var(--exam)}
.err{background:var(--good-bg);color:var(--good);border-radius:999px;padding:1px 10px}
.err.has{background:var(--bad-bg);color:var(--bad)}
.qq{font-size:21px;font-weight:700;line-height:1.55}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px;font-size:18px;min-height:58px}
.opt .l{width:28px;height:28px;border-radius:50%;background:#f3ece3;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.opt:not([disabled]):hover{border-color:var(--ink)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.fb{border-radius:16px;padding:14px;background:var(--good-bg)}
.fb.no{background:var(--bad-bg)}
.fb h4{margin:0 0 4px;font-size:18px;color:var(--good)}
.fb.no h4{color:var(--bad)}
.fb p{margin:0 0 10px}
.tsay{display:flex;gap:10px;background:#fff;border-radius:12px;padding:10px;margin-bottom:12px;align-items:flex-start}
.av{width:32px;height:32px;border-radius:50%;background:var(--grass-dark);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.tsay small{display:block;color:var(--grass-dark);font-weight:700;font-size:12px}
.result{text-align:center}
.result .big{font-family:var(--display);font-size:56px;line-height:1.1;font-variant-numeric:tabular-nums}
.result p{margin:6px 0 16px;color:var(--muted)}
.actions{display:flex;flex-direction:column;gap:10px}
.nl svg{width:100%;height:auto;display:block;cursor:crosshair;touch-action:manipulation}
.target{font-size:24px;font-weight:700;text-align:center;font-family:var(--display)}
.primes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.primes button{border:2px solid #d9c8f3;background:#fff;border-radius:14px;padding:12px;font-size:22px;font-weight:700}
.primes button:hover{border-color:var(--game)}
.chain{font-size:20px;text-align:center;line-height:1.8;min-height:2em}
.chain b{color:var(--game)}
.note{font-size:14px;color:var(--muted);text-align:center;margin:0}
.flash{text-align:center;font-weight:700;min-height:1.6em}
.flash.ok{color:var(--good)}.flash.no{color:var(--bad)}

.modal{position:fixed;inset:0;background:rgba(30,43,51,.35);display:grid;place-items:center;z-index:10;padding:16px}
.modal .m{background:var(--paper);border-radius:20px;padding:24px;width:min(360px,100%);display:flex;flex-direction:column;gap:14px}
.modal h2{font-size:24px;text-align:center}
.modal input{font:inherit;font-size:17px;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
.modal label{font-size:14px;color:var(--muted)}

@media (max-width:860px){
  #island{grid-template-columns:1fr;grid-template-rows:48% 52%}
  .panel{border-left:0;border-top:1px solid var(--line)}
  .pill{font-size:13px;padding:5px 9px}
  .pill.title{font-size:14px}
  .say{font-size:13px}
}
@media (max-width:420px){
  .opts{grid-template-columns:1fr}
  .ph h2{font-size:22px}
}

/* ---------- 引導與互動（v3） ---------- */
.nextbar{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;width:100%;text-align:left;border:2px solid #f2c94c;background:#fff8dc;border-radius:16px;padding:12px 14px}
.nextbar .k{font-size:12px;font-weight:900;color:#a27800;letter-spacing:.04em}
.nextbar .v{grid-column:1;font-weight:700;font-size:17px}
.nextbar small{grid-column:1;color:var(--muted);font-size:13px}
.nextbar .go{grid-column:2;grid-row:1/4;font-size:24px;color:#a27800}
.nextbar.done{display:block;font-weight:700;color:#7a5c00}
.row.isnext{background:#fffbe8}
.nexttag{font-style:normal;font-size:12px;background:#f2c94c;color:#5a4300;border-radius:999px;padding:1px 8px;margin-left:4px;vertical-align:middle}
.lbl.next{box-shadow:0 0 0 3px #ffd34d,0 0 14px 4px rgba(255,211,77,.8)}
.sub-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sub-acts .btn:only-child{grid-column:1/3}
.btn.try{background:#fff;color:var(--game);border:2px dashed #c9b2ef;margin-bottom:10px}
.trybox{border:2px dashed #c9b2ef;background:#faf6ff;border-radius:14px;padding:10px 12px;margin-bottom:12px}
.tryh{display:flex;justify-content:space-between;align-items:center;color:var(--game);margin-bottom:6px}
.tool{display:flex;flex-direction:column;gap:8px}
.tool svg{width:100%;height:auto;background:#fff;border-radius:10px;touch-action:none;user-select:none}
.tool .tip{margin:0;font-size:14px;color:var(--muted)}
.tool .out{margin:0;font-size:15px;line-height:1.7}
.tool .out small{color:var(--muted)}
.big-range{width:100%;height:36px;accent-color:var(--game)}
.stps{display:flex;flex-wrap:wrap;gap:8px}
.stp{display:flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px 6px;font-size:13px}
.stp button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#f6f1ff;font-size:20px;font-weight:700;color:var(--game)}
.stp b{min-width:30px;text-align:center;font-size:17px}
.mini{min-height:40px;border-radius:10px;border:1px solid #c9b2ef;background:#fff;color:var(--game);font-weight:700;padding:6px 12px;align-self:flex-start}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.chip{min-width:52px;min-height:48px;border-radius:12px;border:2px solid #3a67d1;background:#eef3ff;font-size:20px;font-weight:700;color:#3a67d1}
.chip.neg{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.op{font-size:18px;color:var(--muted)}
.expr{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:20px;background:#fff;border-radius:12px;padding:10px}
.opb{min-width:46px;min-height:46px;border-radius:50%;border:2px solid var(--game);background:#f6f1ff;font-size:22px;font-weight:700;color:var(--game)}
.num{font-weight:700}.num.big{font-size:30px}
.hist{margin:0;padding-left:22px;font-size:14px;color:var(--muted)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp>div{background:#fff;border-radius:12px;padding:10px;text-align:center;font-size:18px;line-height:1.6}
.cmp small{font-size:12px;color:var(--muted);word-break:break-all}
.sci{background:#fff;border-radius:12px;padding:16px 10px;text-align:center;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;word-break:break-all}
.sci.ok{outline:3px solid var(--good)}
.sci .mant{color:var(--game)}
.rects{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.rect{display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff;border-radius:8px;padding:6px}
.rect svg{background:none}
.tree{background:#fff;border-radius:12px;padding:10px;font-size:18px;line-height:1.8}
.tr b{color:var(--game)}
.tile{display:inline-grid;place-items:center;width:30px;height:30px;margin:2px;border-radius:7px;background:var(--t);color:#fff;font-weight:700;font-style:italic;transition:opacity .3s}
.tile.gone{opacity:.25;text-decoration:line-through}
.row-t,.frac-t{background:#fff;border-radius:12px;padding:10px;text-align:center}
.bar-t{height:2px;background:var(--ink);margin:6px 10%}
.groups{display:flex;flex-wrap:wrap;gap:8px}
.grp{border:2px solid #2f9e5b;border-radius:10px;padding:4px;background:#fff}
.hop{stroke-dasharray:400;stroke-dashoffset:400;animation:hop .6s ease-out forwards}
@keyframes hop{to{stroke-dashoffset:0}}
.c-ok{color:var(--good)}.c-no{color:var(--bad)}.b{font-weight:700}
.btn.help{border:2px solid #f2c94c;background:#fffbe8;color:#7a5c00}
.hintbox{background:#fffbe8;border:2px solid #f2c94c;border-radius:14px;padding:10px 14px}
.hintbox b{color:#a27800;font-size:13px}
.hintbox p{margin:4px 0 0;font-size:17px}
.stepbox{background:#f3f8ff;border:2px solid #b9cdf3;border-radius:14px;padding:12px}
.sbh{font-weight:900;font-size:13px;color:var(--ch1);margin-bottom:6px}
.steps-done{margin:0 0 8px;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.steps-done li{background:#fff;border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.steps-done .sq{font-size:14px;color:var(--muted)}
.steps-done .sa{font-size:18px;font-weight:700;color:var(--good)}
.steps-done small{color:var(--muted)}
.stepq{font-size:17px;margin:4px 0 8px}
.sopts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sopt{min-height:52px;border-radius:12px;border:2px solid #b9cdf3;background:#fff;font-size:17px;padding:8px}
.sopt.no{border-color:var(--bad);background:var(--bad-bg);text-decoration:line-through}
.smsg{margin:8px 0 0;font-weight:700}
.misline{background:#fff;border-radius:10px;padding:8px 10px;font-size:15px}
.twin{background:#fff;border-radius:12px;padding:10px;margin-bottom:10px}
.qq.sm{font-size:18px;margin-bottom:8px}
.opt.sel{border-color:var(--ink);background:#f1eee9}
.dots i.help{background:#f2c94c}.dots i.done{background:#9aa5ac}
.tally{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}

<script>
/* ================= 工具 ================= */
const M='−';
const n=x=>x<0?M+(-x):''+x;
const p=x=>x<0?'('+n(x)+')':n(x);
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const rnz=(a,b)=>{let x=0;while(x===0)x=ri(a,b);return x};
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a}
function lcm(a,b){return a/gcd(a,b)*b}
class Fr{constructor(a,b=1){if(b<0){a=-a;b=-b}const g=gcd(a,b)||1;this.a=a/g;this.b=b/g}
  add(o){return new Fr(this.a*o.b+o.a*this.b,this.b*o.b)}
  sub(o){return new Fr(this.a*o.b-o.a*this.b,this.b*o.b)}
  mul(o){return new Fr(this.a*o.a,this.b*o.b)}
  div(o){return new Fr(this.a*o.b,this.b*o.a)}
  neg(){return new Fr(-this.a,this.b)}
  key(){return this.a+'/'+this.b}}
const frRaw=(a,b)=>(a<0?M:'')+`<span class="fr"><span>${Math.abs(a)}</span><span>${b}</span></span>`;
const fh=f=>f.b===1?n(f.a):frRaw(f.a,f.b);
const fp=f=>f.a<0?'('+fh(f)+')':fh(f);
const pw=(B,e)=>e===1?B:`${B}<sup>${n(e)}</sup>`;
const sci=(a,e)=>`${a} × 10<sup>${n(e)}</sup>`;
/* 標記語法：[a/b] 轉成分數 */
const mk=s=>s.replace(/\[([^\/\[\]]+)\/([^\/\[\]]+)\]/g,(_,a,b)=>{const neg=a[0]===M;return(neg?M:'')+`<span class="fr"><span>${neg?a.slice(1):a}</span><span>${b}</span></span>`});

const ltx=s=>String(s).replace(/<(?=[\s\d−=])/g,'&lt;');
/* m（選填）＝引導資料：{hint, steps:[{q,o:[正解,…],e}], mis:[與 opts 對齊的錯誤觀念，opts[0] 為 null]} */
function finalize(q,opts,exp,m){const idx=shuffle(opts.map((_,i)=>i));const o={q:ltx(q),opts:idx.map(i=>ltx(opts[i])),ans:idx.indexOf(0),exp:ltx(exp)};
  if(m){o.hint=m.hint?ltx(m.hint):null;o.mis=idx.map(i=>i===0?null:((m.mis&&m.mis[i])||'計算過程出錯'));
    o.steps=(m.steps||[]).map(st=>{const uniq=[...new Set(st.o.map(String))];if(uniq.length<2){const alt=uniq[0].replace(/−?\d+/,d=>n(parseInt(d.replace('−','-'))+1));uniq.push(alt!==uniq[0]?alt:'以上皆非')}const j=shuffle(uniq.map((_,i)=>i));return{q:ltx(st.q),opts:j.map(i=>ltx(uniq[i])),ans:j.indexOf(0),e:ltx(st.e||'')}})}
  return o}
const st=(q,o,e='')=>({q,o,e});
function numQ(q,ans,cands,exp,fmt=n,m){const rd=v=>Number.isFinite(v)?Math.round(v*1e6)/1e6:v;ans=rd(ans);cands=cands.map(rd);const s=[ans],lab=[null];
  cands.forEach((c,i)=>{if(s.length<4&&Number.isFinite(c)&&!s.includes(c)){s.push(c);lab.push(m&&m.mis?m.mis[i]:null)}});
  let k=1;while(s.length<4){for(const c of [ans+k,ans-k])if(s.length<4&&!s.includes(c)){s.push(c);lab.push(null)}k++}
  return finalize(q,s.map(fmt),exp,m?{...m,mis:lab}:null)}
function frQ(q,ans,cands,exp,m){const s=[ans],keys=[ans.key()],lab=[null];cands.forEach((c,i)=>{if(s.length<4&&c&&!keys.includes(c.key())){s.push(c);keys.push(c.key());lab.push(m&&m.mis?m.mis[i]:null)}});
  let k=1;while(s.length<4){for(const c of [ans.add(new Fr(k,ans.b)),ans.sub(new Fr(k,ans.b))])if(s.length<4&&!keys.includes(c.key())){s.push(c);keys.push(c.key());lab.push(null)}k++}
  return finalize(q,s.map(fh),exp,m?{...m,mis:lab}:null)}
function strQ(q,ans,cands,fallback,exp,m){const s=[ans],lab=[null];cands.concat(fallback).forEach((c,i)=>{if(s.length<4&&c&&!s.includes(c)){s.push(c);lab.push(m&&m.mis&&i<cands.length?m.mis[i]:null)}});return finalize(q,s,exp,m?{...m,mis:lab}:null)}

/* ================= 課程內容（康軒版七上 第1–2章） ================= */
const SEC_NUMBER=[
 {id:'1-1',ch:1,title:'負數與數線',glyph:'−3',pos:[175,215],game:'g1',subs:[

  {id:'1-4b',title:'科學記號',pts:['科學記號寫成 a × 10<sup>n</sup>，其中 1 ≤ a < 10，n 是整數。','大數：小數點往左移幾位，n 就是正幾，例如 52000 = 5.2 × 10<sup>4</sup>。','小數：小數點往右移幾位，n 就是負幾，例如 0.0036 = 3.6 × 10<sup>−3</sup>。','1 奈米 = 10<sup>−9</sup> 公尺，1 微米 = 10<sup>−6</sup> 公尺。']}]},

  {id:'2-3b',title:'分數的乘除',pts:['分數相乘：分子乘分子、分母乘分母，可以先約分再乘。','除以一個數，等於乘以它的倒數：[a/b] ÷ [c/d] = [a/b] × [d/c]。','正負號規則和整數一樣：同號得正，異號得負。']}]},

M3.walk=function(path){if(!teacher)return;const pts=path.map(p=>W(...p));const cur=teacher.position;const nearHub=p=>Math.hypot(p[0]-HUB[0],p[1]-HUB[1])<9;const last=pts[pts.length-1];
  if(reduce){teacher.position.set(last[0],TOP,last[1]);tq=[];return}
  tq=(!nearHub([cur.x,cur.z])&&!nearHub(last))?[[HUB[0]+2,HUB[1]+1],...pts]:pts};

  if(reduce){const off=cam.position.clone().sub(ctl.target).setLength(dist);ctl.target.copy(t);cam.position.copy(t).add(off);return}fly={t,dist}};

    if(ctl.target.distanceTo(fly.t)<.05&&Math.abs(L-fly.dist)<.2)fly=null}
  ctl.update();
  if(tq.length){const [gx,gz]=tq[0];const p=teacher.position;const dx=gx-p.x,dz=gz-p.z,dd=Math.hypot(dx,dz);const sp=.28;
    if(dd<sp){p.x=gx;p.z=gz;tq.shift()}else{p.x+=dx/dd*sp;p.z+=dz/dd*sp;teacher.rotation.y=Math.atan2(dx,dz)}
    p.y=TOP+Math.abs(Math.sin(now*12))*.18}else{teacher.position.y=TOP;teacher.rotation.y+=(0-teacher.rotation.y)*.05}
  boat.position.y=.3+Math.sin(now*1.6)*.15;boat.rotation.z=Math.sin(now*1.3)*.04;
  if(ring){const k=reduce?1:1+Math.sin(now*3)*.06;ring.scale.set(k,k,k);ring.material.opacity=reduce?.85:.6+Math.sin(now*3)*.25}
  R.render(scene,cam);
  const w=R.domElement.clientWidth,h=R.domElement.clientHeight,v=new THREE.Vector3();
  labels.forEach(L=>{v.copy(L.p).project(cam);const vis=v.z<1&&Math.abs(v.x)<1.1&&Math.abs(v.y)<1.1;L.el.style.display=vis?'':'none';if(vis){L.el.style.left=((v.x+1)/2*w).toFixed(1)+'px';L.el.style.top=((1-v.y)/2*h).toFixed(1)+'px';L.el.style.zIndex=String(Math.round((1-v.z)*1e5))}});
}

function dotsHTML(Q){return`<div class="dots">${Q.qs.map((_,k)=>{const r=Q.res[k];const c=k===Q.i&&!Q.done&&r===undefined?'cur':r==='ok'?'ok':r==='help'?'help':r==='no'?'no':r==='done'?'done':'';return`<i class="${c}"></i>`}).join('')}</div>`}
function renderQuiz(){
  const Q=P.quiz;const N=Q.qs.length;const ex=Q.kind==='exam'?CUR.exams.find(x=>x.key==Q.id):null;
  const title=Q.kind==='sub'?SUBS[Q.id].title:ex.title;
  const eb=Q.kind==='sub'?`${SUBS[Q.id].sec.vol} ${SUBS[Q.id].sec.no} ${SUBS[Q.id].sec.title}`:'會考小船';
  let h=head(eb,title);
  if(Q.done)return h+renderResult(Q);
  const q=Q.qs[Q.i],C=Q.cur;
  const firstOk=Q.res.filter(r=>r==='ok').length;
  h+=`<div class="pb"><div class="qtop">${dotsHTML(Q)}<span>第 ${Q.i+1} 題 / 共 ${N} 題</span>${Q.kind==='sub'?`<span class="err">第一次就答對 ${firstOk}</span>`:''}</div>`;
  h+=`<div class="qq">${q.q}</div>`;
  /* 會考：只記錄答案，不給回饋 */
  if(Q.kind==='exam'){const pk=Q.picks[Q.i];h+=`<div class="opts">${q.opts.map((o,k)=>`<button class="opt ${pk===k?'sel':''}" data-opt="${k}"><span class="l">${LET[k]}</span><span>${o}</span></button>`).join('')}</div>`;
    if(pk!==undefined)h+=`<button class="btn" data-act="next">${Q.i<N-1?'下一題':'交卷'}</button>`;return h+`</div>`}
  const locked=C.phase!=='ask'&&C.phase!=='hint';
  h+=`<div class="opts">${q.opts.map((o,k)=>{let cls='';if(C.tried.includes(k))cls='no';if(locked&&k===q.ans)cls='ok';if(C.phase==='reveal'&&!C.helped&&k===q.ans)cls='ok';return`<button class="opt ${cls}" data-opt="${k}" ${locked||C.tried.includes(k)?'disabled':''}><span class="l">${LET[k]}</span><span>${o}</span></button>`}).join('')}</div>`;
  if(C.phase==='ask'&&q.hint)h+=`<button class="btn ghost help" data-act="idk">我不會，給我提示</button>`;
  if(C.phase==='hint')h+=`<div class="hintbox"><b>提示</b><p>${q.hint}</p></div>${tsay(C.tried.length?'先看提示，再選一次！':'看完提示，試著選選看！')}`;
  if(C.phase==='steps')h+=renderSteps(q,C);
  if(C.phase==='reveal'||C.phase==='twin')h+=renderReveal(Q,q,C);
  return h+`</div>`;

function renderSteps(q,C){let h=`<div class="stepbox"><div class="sbh">我們一步一步來（共 ${q.steps.length} 步）</div><ol class="steps-done">`;

function logMis(Q,q,k){if(q.mis&&q.mis[k])Q.misLog.push(q.mis[k])}
function choose(k){const Q=P.quiz,q=Q.qs[Q.i],C=Q.cur;

  C.tried.push(k);logMis(Q,q,k);if(C.firstWrong===null)C.firstWrong=k;
  if(!q.hint){Q.res[Q.i]='no';C.phase='reveal';C.msg=pick(COMFORT);say(C.msg);P.scrollSel='.fb';render();return}

  /* 提示後又答錯：進入步驟引導 */
  Q.res[Q.i]='no';C.phase=q.steps&&q.steps.length?'steps':'reveal';C.msg=pick(COMFORT);say('我們一步一步來。');P.scrollSel=C.phase==='steps'?'.stepbox':'.fb';render()}

function nlSVG(mark,ans,state){const W=340,L=20,Rr=320,y=60;const X=v=>L+(v+10)/20*(Rr-L);let s=`<svg viewBox="0 0 ${W} 100" id="nl" role="img" aria-label="−10 到 10 的數線"><rect width="${W}" height="100" fill="#fff" rx="12"/><line x1="${L-8}" y1="${y}" x2="${Rr+8}" y2="${y}" stroke="var(--ink)" stroke-width="2"/><polygon points="${Rr+14},${y} ${Rr+6},${y-4} ${Rr+6},${y+4}" fill="var(--ink)"/>`;

/* 1-2a 整數加法：數線跳跳 */

/* 1-2b 減法＝加相反數：兩條數線對照 */

   ${tlbl(60,102,`${n(a)} + ${p(-b)}`,'var(--ink)',13)}${nl2.base}${b?arc(nl2.X(a),nl2.X(c),nl2.y,col):''}${dot(nl2.X(a),nl2.y,'#3a67d1')}</svg>

/* 1-3a 乘除與正負號：點選切換正負 */
TOOLS['1-3a']=root=>{let F=[2,-3,4];const draw=()=>{const prod=F.reduce((x,y)=>x*y,1),neg=F.filter(x=>x<0).length;
  root.innerHTML=`<p class="tip">點一下數字可以切換正負號。看看負數的個數怎麼決定答案的正負。</p><div class="chips">${F.map((x,i)=>`<button type="button" class="chip ${x<0?'neg':''}" data-i="${i}">${n(x)}</button>`).join('<span class="op">×</span>')}</div>

   <p class="out">${F.map(p).join(' × ')} = <b>${n(prod)}</b><br>負數有 <b>${neg}</b> 個，是${neg%2?'奇':'偶'}數個 → 乘積是<b>${prod>0?'正':'負'}</b>的。</p>`};

/* 1-3b 四則運算順序：點選要先算的運算 */
TOOLS['1-3b']=root=>{let T,hist,msg;
  const pri=o=>o==='×'||o==='÷';
  const next=t=>{const ops=t.map((x,i)=>i%2?i:-1).filter(i=>i>0);const md=ops.find(i=>pri(t[i]));return md!==undefined?md:ops[0]};
  const calc=(a,o,b)=>o==='+'?a+b:o==='−'?a-b:o==='×'?a*b:a/b;
  const gen=()=>{for(;;){const t=[rnz(-9,9)];for(let i=0;i<3;i++)t.push(pick(['+','−','×','÷']),rnz(-9,9));if(!t.some((x,i)=>i%2&&pri(x)))continue;let u=t.slice(),ok=true;while(u.length>1){const i=next(u);const r=calc(u[i-1],u[i],u[i+1]);if(!Number.isInteger(r)||AB(r)>200){ok=false;break}u.splice(i-1,3,r)}if(ok){T=t;hist=[];msg='點一個運算符號，選出「現在應該先算」的那一步。';return}}};
  const show=t=>t.map((x,i)=>i%2?`<button type="button" class="opb" data-o="${i}">${x}</button>`:`<span class="num">${p(x)}</span>`).join('');
  const draw=()=>{root.innerHTML=`<p class="tip">先乘除、後加減；同一級由左到右。</p><div class="expr">${T.length>1?show(T):`<span class="num big">${n(T[0])}</span>`}</div><p class="out">${msg}</p>${hist.length?`<ol class="hist">${hist.map(h=>`<li>${h}</li>`).join('')}</ol>`:''}<button type="button" class="mini" data-new="1">換一題</button>`};
  root.addEventListener('click',e=>{if(e.target.closest('[data-new]')){gen();draw();return}const b=e.target.closest('[data-o]');if(!b||T.length<2)return;const i=+b.dataset.o,ok=next(T);
    if(i!==ok){msg=pri(T[ok])&&!pri(T[i])?'<span class="c-no">還有乘除沒算，要先算乘除喔！</span>':'<span class="c-no">同一級的運算要由左到右算。</span>';draw();return}
    const r=calc(T[i-1],T[i],T[i+1]);hist.push(`${p(T[i-1])} ${T[i]} ${p(T[i+1])} = ${n(r)}`);T.splice(i-1,3,r);msg=T.length>1?'<span class="c-ok">對了！再選下一步。</span>':`<span class="c-ok">完成！答案是 ${n(T[0])}。</span>`;draw()});gen();draw()};

/* 1-4a 指數記法：(−a)ⁿ 和 −aⁿ 對照 */

   <div class="cmp"><div><b>(${M}${b})<sup>${e}</sup></b><br><small>${rep(`(${M}${b})`)}</small><br>= <b>${n(v1)}</b></div><div><b>${M}${b}<sup>${e}</sup></b><br><small>${M}(${rep(b)})</small><br>= <b>${n(v2)}</b></div></div>

/* 2-2a 最大公因數：質因數文氏圖 */

TOOLS['2-3a']=root=>{const S={a:1,b:2,c:1,d:3,same:0};const draw=()=>{if(S.a>=S.b)S.a=S.b-1;if(S.c>=S.d)S.c=S.d-1;const{a,b,c,d}=S;const L=lcm(b,d);const k1=S.same?L:b,k2=S.same?L:d,s1=S.same?a*L/b:a,s2=S.same?c*L/d:c;

/* 2-3b 分數乘法：面積模型 */
TOOLS['2-3b']=root=>{const S={a:2,b:3,c:3,d:4};const draw=()=>{if(S.a>S.b)S.a=S.b;if(S.c>S.d)S.c=S.d;const{a,b,c,d}=S;const W=240,H=160,cw=W/b,ch=H/d;let s='';
  for(let i=0;i<b;i++)for(let j=0;j<d;j++){const inA=i<a,inC=j<c;s+=`<rect x="${50+i*cw}" y="${10+j*ch}" width="${cw}" height="${ch}" fill="${inA&&inC?'#8a5bd6':inA?'#c9d6f5':inC?'#fbd9bd':'#fff'}" stroke="var(--ink)" stroke-width=".8"/>`}
  root.innerHTML=`<p class="tip">直的塗 ${frRaw(a,b)}、橫的塗 ${frRaw(c,d)}，兩種都塗到的紫色部分就是相乘的結果。</p><div class="stps">${stp('a','直的分子',a)}${stp('b','分母',b)}${stp('c','橫的分子',c)}${stp('d','分母',d)}</div><svg viewBox="0 0 340 180">${s}</svg>
   <p class="out">${frRaw(a,b)} × ${frRaw(c,d)}：紫色 ${a*c} 格，全部 ${b*d} 格 → ${frRaw(a*c,b*d)}${gcd(a*c,b*d)>1?` = <b>${fh(new Fr(a*c,b*d))}</b>`:''}<br><small>分子乘分子（${a} × ${c}）、分母乘分母（${b} × ${d}）。</small></p>`};
  bindSteppers(root,S,{a:[1,6],b:[1,6],c:[1,6],d:[1,6]},draw);draw()};

/* 2-4a 同底數相乘除：展開與消去 */
TOOLS['2-4a']=root=>{const S={m:5,k:2,div:0};const draw=()=>{const{m,k,div}=S;const tile=(c,x='')=>`<span class="tile ${x}" style="--t:${c}">a</span>`;
  const body=div?`<div class="frac-t"><div>${Array.from({length:m},(_,i)=>tile('#3a67d1',i<Math.min(m,k)?'gone':'')).join('')}</div><div class="bar-t"></div><div>${Array.from({length:k},(_,i)=>tile('#e9822a',i<Math.min(m,k)?'gone':'')).join('')}</div></div>`
   :`<div class="row-t">${Array.from({length:m},()=>tile('#3a67d1')).join('')}<span class="op">×</span>${Array.from({length:k},()=>tile('#e9822a')).join('')}</div>`;
  const res=div?(m>=k?pw('a',m-k).replace('a<sup>0</sup>','1'):`${frRaw(1,'a'+(k-m>1?'<sup>'+(k-m)+'</sup>':''))}`):pw('a',m+k);
  root.innerHTML=`<p class="tip">把次方展開成一個一個的 a。相乘就把它們排在一起；相除時，上下各劃掉一個 a。</p><div class="stps">${stp('m','前面的指數',m)}${stp('k','後面的指數',k)}<button type="button" class="mini" data-div="1">${div?'改成相乘':'改成相除'}</button></div>${body}
   <p class="out">${pw('a',m)} ${div?'÷':'×'} ${pw('a',k)} = <b>${res}</b><br><small>${div?`上下各消去 ${Math.min(m,k)} 個 a，指數相減：${m} − ${k}。`:`一共有 ${m} + ${k} = ${m+k} 個 a，指數相加。`}</small></p>`};
  root.addEventListener('click',e=>{if(e.target.closest('[data-div]')){S.div^=1;draw()}});bindSteppers(root,S,{m:[1,7],k:[1,7]},draw);draw()};

/* 2-4b 次方的次方：分組方塊 */
TOOLS['2-4b']=root=>{const S={m:2,k:3};const draw=()=>{const{m,k}=S;
  root.innerHTML=`<p class="tip">(a<sup>${m}</sup>)<sup>${k}</sup> 是 ${k} 組 a<sup>${m}</sup> 相乘。數數看一共有幾個 a。</p><div class="stps">${stp('m','裡面的指數',m)}${stp('k','外面的指數',k)}</div>
   <div class="groups">${Array.from({length:k},()=>`<div class="grp">${Array.from({length:m},()=>'<span class="tile" style="--t:#2f9e5b">a</span>').join('')}</div>`).join('')}</div>
   <p class="out">${k} 組 × 每組 ${m} 個 = ${m*k} 個 a → (a<sup>${m}</sup>)<sup>${k}</sup> = <b>${pw('a',m*k)}</b><br><small>次方再次方，指數相乘。</small></p>`};
  bindSteppers(root,S,{m:[1,5],k:[1,5]},draw);draw()};
/* ================= 導覽 ================= */
function openSection(id,sub){const s=SECTIONS.find(x=>x.id===id);P={view:'section',sec:id,tab:P.tab,tool:null};const [x,y]=s.pos;moveTeacher(x+22,y+8,s.from);if(M3.ok)M3.focus(x,y);say(`來到 ${s.vol} ${s.no}「${s.title}」，先讀重點再挑戰！`);render();const card=sub&&$('sub-'+sub);if(card)card.scrollIntoView({block:'start'});else $('panel').scrollTop=0}
function teacherToNext(){const nx=nextStation();if(nx)moveTeacher(nx.pos[0]+22,nx.pos[1]+8,nx.from);else moveTeacher(430,330)}
function toIndex(){P={view:'index',tab:P.tab};teacherToNext();if(M3.ok)M3.focus(null);const nx=nextStation();say(nx?`${esc(S.name||'同學')}，建議下一站是 ${nx.vol} ${nx.no}「${nx.title}」，我在那裡等你！`:`${esc(S.name||'同學')}，這座島全部完成了，太厲害了！`);render();$('panel').scrollTop=0}
function back(){if(P.view==='example'){openSection(SUBS[P.ex.sub].sec.id,P.ex.sub);return}if(P.view==='review'){P.view='quiz';P.quiz=P.rv.quiz;render();return}
  if(P.view==='quiz'&&P.quiz.from==='section'){openSection(P.quiz.kind==='sub'?SUBS[P.quiz.id].sec.id:P.sec,P.quiz.kind==='sub'?P.quiz.id:null);return}
  if((P.view==='g1'||P.view==='g2')&&P.from==='section'){openSection(GAMES[P.view].sec);return}toIndex()}
$('panel').addEventListener('click',e=>{const b=e.target.closest('button');if(!b){if(e.target.closest('#nl'))g1Click(e);return}
  const d=b.dataset;
  if(d.act==='back')back();else if(d.act==='close')toIndex();else if(d.act==='next')next();
  else if(d.act==='retry')startQuiz(P.quiz.kind,P.quiz.id);
  else if(d.act==='g1next')g1Next();else if(d.act==='g2next')g2Next();
  else if(d.act==='idk')idk();else if(d.act==='twin')startTwin();
  else if(d.act==='exnext'){P.ex.shown++;P.scrollSel=P.ex.shown<P.ex.q.steps.length?'.exnext':'.fb';render()}else if(d.act==='exagain')startExample(P.ex.sub);
  else if(d.act==='rvnext'){P.rv.shown++;P.scrollSel='.steps-done li:last-child';render()}else if(d.act==='rvback'){P.view='quiz';P.quiz=P.rv.quiz;render();$('panel').scrollTop=0}
  else if(d.step!==undefined)chooseStep(+d.step);else if(d.twin!==undefined)chooseTwin(+d.twin);
  else if(d.ex)startExample(d.ex);else if(d.review!==undefined)startReview(+d.review);
  else if(d.reviewCard)openSection(SUBS[d.reviewCard].sec.id,d.reviewCard);
  else if(d.toolOpen){P.tool=d.toolOpen;render();const c=$('sub-'+d.toolOpen);if(c)c.scrollIntoView({block:'start'})}
  else if(d.toolClose){P.tool=null;render()}
  else if(d.tab){P.tab=d.tab;render()}
  else if(d.sec)openSection(d.sec);
  else if(d.quiz)startQuiz('sub',d.quiz);
  else if(d.examstart)startQuiz('exam',d.examstart);
  else if(d.opt!==undefined)choose(+d.opt);
  else if(d.prime)g2Pick(+d.prime);
  else if(d.game){d.game==='g1'?startG1():startG2()}
});
function mapAct(g){if(g)mapActData(g.dataset)}
function mapActData(a){if(!a)return;if(a.sec)openSection(a.sec);else if(a.game){P.view='section';P.sec=GAMES[a.game].sec;if(M3.ok)M3.focus(...GAMES[a.game].pos);a.game==='g1'?startG1():startG2()}else if(a.exam){P={view:'index',tab:'exam'};moveTeacher(CUR.boat[0]+10,CUR.boat[1]+5);if(M3.ok)M3.focus(...CUR.boat);say('會考小船在這裡，選一組出航吧！');render()}}
window.mapActData=mapActData;
$('mapsvg').addEventListener('click',e=>mapAct(e.target.closest('.isle')));
$('mapsvg').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();mapAct(e.target.closest('.isle'))}});
$('btnView').onclick=()=>M3.focus(null);
$('btnSpin').onclick=e=>{const b=e.currentTarget;const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);M3.spin(on)};
$('toHome').onclick=()=>{location.hash='home'};
$('hudName').onclick=()=>askName();
function askName(){$('nameIn').value=S.name||'';$('nameModal').classList.remove('hidden');setTimeout(()=>$('nameIn').focus(),50)}
$('nameForm').addEventListener('submit',e=>{e.preventDefault();S.name=$('nameIn').value.trim().slice(0,12)||'同學';save();$('nameModal').classList.add('hidden');say(`嗨，${esc(S.name)}！點一座小島開始挑戰。`);render()});

/* ================= 入口頁 ================= */
const ICONS={
 number:'<line x1="40" y1="62" x2="160" y2="62" stroke="#1e2b33" stroke-width="3"/><g fill="#1e2b33">'+[0,1,2,3,4].map(i=>`<rect x="${58+i*21}" y="55" width="2.5" height="14"/>`).join('')+'</g><circle cx="80" cy="62" r="7" fill="#3a67d1"/><text x="80" y="46" text-anchor="middle" font-size="16" font-weight="700" fill="#3a67d1">−1</text>',
 algebra:'<rect x="62" y="30" width="76" height="46" rx="8" fill="#fff" stroke="#e9822a" stroke-width="3"/><text x="100" y="62" text-anchor="middle" font-size="22" font-weight="700" fill="#e9822a">x = ?</text>',
 function:'<line x1="70" y1="78" x2="70" y2="22" stroke="#1e2b33" stroke-width="3"/><line x1="64" y1="72" x2="140" y2="72" stroke="#1e2b33" stroke-width="3"/><path d="M78 26 Q104 100 130 26" fill="none" stroke="#2f9e5b" stroke-width="4"/>',
 geometry:'<polygon points="100,20 140,76 60,76" fill="#efe6fb" stroke="#8a5bd6" stroke-width="4"/><circle cx="100" cy="58" r="12" fill="none" stroke="#8a5bd6" stroke-width="3"/>',
 stats:'<rect x="68" y="50" width="14" height="26" fill="#d6455b"/><rect x="92" y="34" width="14" height="42" fill="#d6455b"/><rect x="116" y="58" width="14" height="18" fill="#d6455b"/>',
};
const ICOL={number:'var(--ch1)',algebra:'var(--ch2)',function:'var(--good)',geometry:'var(--game)',stats:'var(--exam)'};
function homeIsle(icon){return`<svg viewBox="0 0 200 130" aria-hidden="true"><ellipse cx="100" cy="112" rx="88" ry="14" fill="rgba(0,0,0,.12)"/><polygon points="${hex(100,98,82,.32)}" fill="#d9bf86"/><polygon points="${hex(100,90,82,.32)}" fill="#f3e2b8"/><polygon points="${hex(100,88,64,.32)}" fill="#9fd36f"/>${icon}</svg>`}
const VOLS=['七上','七下','八上','八下','九上','九下'];
function renderHome(){
  const all=ISL_ORDER.reduce((a,k)=>a+islStars(ISL[k]),0),allT=ISL_ORDER.reduce((a,k)=>a+islTotal(ISL[k]),0);
  let h=`<div class="home-in"><div class="home-top"><div><h1>國中數學群島</h1><p>選一座島全部逛，或從下面挑一節，只練那一節的範圍。</p></div><span class="chip"><span class="s">★</span>${all} / ${allT}</span></div><div class="isles">`;
  ISL_ORDER.forEach(k=>{const I=ISL[k];h+=`<button class="isle-card" style="--c:${ICOL[k]}" data-big="${k}">${homeIsle(ICONS[k])}<div class="box"><h3>${I.name}</h3><small>${I.sub}</small><small>${I.secs.length} 座小島 · ${I.exams.length} 組會考題</small><div class="meta"><span style="color:var(--gold)">★</span> ${islStars(I)} / ${islTotal(I)}</div></div></button>`});
  h+=`</div><div class="chapters"><h2>依課本章節進入</h2><p>順序與康軒版課本相同：七上到九下，共 ${ISL_ORDER.reduce((a,k)=>a+ISL[k].secs.length,0)} 節。</p>`;
  VOLS.forEach(v=>{const list=[];ISL_ORDER.forEach(k=>ISL[k].secs.forEach(s=>{if(s.vol===v)list.push(s)}));if(!list.length)return;list.sort((a,b)=>a.no.localeCompare(b.no,'en',{numeric:true}));
    h+=`<div class="vol">${v}</div>`;list.forEach(s=>{h+=`<button class="crow" style="--c:${s.color}" data-go="${s.isl}|${s.id}"><b>${s.no}</b><span>${s.title}<small>${ISL[s.isl].name}</small></span><span class="st">★ ${secStars(s)}/${s.subs.length}</span></button>`})});
  h+=`</div></div>`;$('home').innerHTML=h;
}
let pendingSec=null;
$('home').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.big){location.hash=b.dataset.big}else if(b.dataset.go){const [k,id]=b.dataset.go.split('|');pendingSec=id;if(location.hash==='#'+k)route();else location.hash=k}});
function route(){const h=location.hash.replace('#','');
  if(ISL[h]){setIsland(h);$('home').classList.add('hidden');$('island').classList.remove('hidden');$('sayName').textContent=CUR.hub.replace('島','')+'老師';
    TPOS=[430,330];M3.init();if(M3.ok)M3.load();drawMap();
    if(pendingSec){openSection(pendingSec);pendingSec=null}else{P={view:'index',tab:'learn'};render();teacherToNext();say(`${S.name?esc(S.name)+'，':''}歡迎來到${CUR.name}！點一座小島開始挑戰${M3.ok?'（拖曳可以旋轉地圖）':''}。`)}
    if(!S.name)askName()}
  else{$('island').classList.add('hidden');$('home').classList.remove('hidden');renderHome();$('home').scrollTop=0}}
window.addEventListener('hashchange',route);
route();

</script>
